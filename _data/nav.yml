# Canwest Art Services — site navigation
# To add a new product category: add one item under "products" with a label
# and a url. It will appear on every page automatically, already alphabetized.
# The Paints dropdown is split into two brand groups instead: add an oil
# brand under "oilpaints" or a watercolour brand under "watercolours". No
# HTML editing needed either way.

products:
  - label: Art Cards
    url: products.html#artcards
  - label: Canvases
    url: products.html#canvases
  - label: Master Product Listing
    url: master-product-listing.html
  - label: Paintings
    url: paintings.html
  - label: Watercolour Paper
    url: products.html#watercolourpaper

oilpaints:
  - label: Cranfield
    url: artists-oils.html
  - label: Gamblin
    url: gamblin-oils.html

watercolours:
  - label: Winsor & Newton
    url: winsor-newton.html
